[package]
name = "qkmj_browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
server = [
    "dep:axum",
    "dep:futures-util",
    "dep:rand",
    "dep:tokio",
    "dep:tower-http",
]

[dependencies.axum]
version = "0.8"
features = ["ws"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dependencies.tokio]
version = "1"
features = ["macros", "net", "rt-multi-thread", "sync", "time"]
optional = true

[dependencies.tower-http]
version = "0.6"
features = ["fs"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[[bin]]
name = "qkmj-server"
path = "src/bin/qkmj-server.rs"
required-features = ["server"]
